name: simulator evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned simulator and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify committed evidence integrity and scope
        run: python scripts/verify_frozen_evidence.py
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

  full-reproduction:
    name: Full deterministic simulator reproduction
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned simulator and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run the 3,600-step local simulation
        env:
          MPLBACKEND: Agg
          ROBOTARIUM_HEADLESS: "1"
          ROBOTARIUM_FAST: "1"
          ROBOTARIUM_OUTPUT_DIR: ${{ runner.temp }}/robotarium-reproduction
        run: |
          mkdir -p "$ROBOTARIUM_OUTPUT_DIR"
          python experiment.py | tee "$ROBOTARIUM_OUTPUT_DIR/simulator.log"
      - name: Compare stable results with frozen evidence
        run: >-
          python scripts/compare_reproduction.py
          evidence/simulator-3072698/robotarium_coverage_summary.json
          "${{ runner.temp }}/robotarium-reproduction/robotarium_coverage_summary.txt"
          evidence/simulator-3072698/robotarium_coverage_trajectory.npy
          "${{ runner.temp }}/robotarium-reproduction/robotarium_coverage_trajectory.npy"
      - name: Upload fresh simulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotarium-simulator-reproduction
          path: ${{ runner.temp }}/robotarium-reproduction
          if-no-files-found: error
